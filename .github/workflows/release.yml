# Build Heaviside, check it against PyOpenColorIO, and release every push to main that passes.
#
# The version is the commit time in New York, YY.MMDD.HHMM (26.1015.1215), as Nearside and
# Farside do it; it is the release tag and is built into the module (Heaviside.build()).
# Nearside pins a release by tag and checksum (Nearside heaviside.json), so a release is
# never replaced: a version that already has one is skipped.
name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        id: version
        run: echo "version=$(TZ=America/New_York git log -1 --format=%cd --date=format-local:%y.%m%d.%H%M)" | tee -a "$GITHUB_OUTPUT"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12

      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build
        run: |
          emcmake cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHEAVISIDE_VERSION=${{ steps.version.outputs.version }}
          cmake --build build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compare with PyOpenColorIO
        run: |
          pip install opencolorio==2.5.2
          python test/reference.py reference.json ocio://studio-config-latest
          node test/compare.mjs reference.json

      - name: Checksums
        working-directory: build
        run: sha256sum heaviside.mjs heaviside.wasm | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: heaviside-${{ steps.version.outputs.version }}
          path: |
            build/heaviside.mjs
            build/heaviside.wasm
            build/SHA256SUMS

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION exists; releases are never replaced"
            exit 0
          fi
          # from the module itself: the checkout has no submodule tags to describe
          ocio=$(node --input-type=module -e "import H from './build/heaviside.mjs'; console.log((await H()).version())")
          gh release create "$VERSION" build/heaviside.mjs build/heaviside.wasm build/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Heaviside $VERSION" \
            --notes "OpenColorIO ${ocio}, Emscripten 6.0.12. Checked against PyOpenColorIO 2.5.2 on the built-in studio config."
